# RunyMediaMonitor — media.as7th.com (cert via lego DNS-01, same pattern as other as7th.com sites)
server {
    listen 80;
    listen [::]:80;
    server_name media.as7th.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; allow all; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.as7th.com;
    root /var/www/runymedia/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;
    ssl_certificate     /etc/lego/certificates/media.as7th.com.crt;
    ssl_certificate_key /etc/lego/certificates/media.as7th.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/media.as7th.com.access.log;
    error_log  /var/log/nginx/media.as7th.com.error.log warn;

    # Media files: only reachable through Laravel's signed-URL check (X-Accel-Redirect).
    location ^~ /_rmm_protected/ {
        internal;
        alias /var/lib/runymedia/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ /\.(?!well-known).* { deny all; access_log off; log_not_found off; }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
}
