; Dedicated PHP-FPM master for RunyMediaMonitor (isolated from the system php8.5-fpm used by other sites).
[global]
pid = /run/runymedia/fpm.pid
error_log = /var/log/runymedia-fpm.log
daemonize = no

[runymedia]
user = www-data
group = www-data
listen = /run/runymedia/fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s
pm.max_requests = 500
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
